# Builds the firmware for a version tag and attaches it to that tag's release:
#  the four parts the install page flashes, the merged image for esptool, the
#  ESP Web Tools manifest, and firmware.json with their sha256s and this run.
#  The website's install page serves copies of the parts, see docs/README.md.
#
# Release: set FIRMWARE_VERSION in the firmware, commit, then tag "v" plus that
#  version and push the tag. A tag with a "-" (v0.2.0-rc.1) makes a prerelease.

name: Release

on:
  push:
    tags: ["v*"]
  # Builds an existing tag again and replaces its assets
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, like v0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # The versions in the README's "Tested hardware"
  ARDUINO_CLI_VERSION: 1.3.1
  ESP32_CORE: esp32:esp32@3.3.7
  TFT_ESPI: TFT_eSPI@2.5.43
  XPT2046: XPT2046_Touchscreen@1.4
  INDEX_URL: https://espressif.github.io/arduino-esp32/package_esp32_index.json
  FQBN: esp32:esp32:esp32

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      # Before the long download, so a tag that doesn't match fails in seconds
      - name: Check the tag against FIRMWARE_VERSION
        run: python3 scripts/release-assets.py "$TAG"

      # secrets.h is gitignored, so a release never carries anyone's Wi-Fi
      - name: Check there is no secrets.h
        run: test ! -e firmware/cheap-rex-display/secrets.h

      - uses: arduino/setup-arduino-cli@v2
        with:
          version: ${{ env.ARDUINO_CLI_VERSION }}

      # The core is about 1.5 GB to download
      - uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ env.ARDUINO_CLI_VERSION }}-${{ env.ESP32_CORE }}-${{ env.TFT_ESPI }}-${{ env.XPT2046 }}

      - name: Install the ESP32 core and the libraries
        run: |
          arduino-cli core update-index --additional-urls "$INDEX_URL"
          arduino-cli core install "$ESP32_CORE" --additional-urls "$INDEX_URL"
          arduino-cli lib install "$TFT_ESPI"
          arduino-cli lib install "$XPT2046"

      - name: Build
        run: |
          arduino-cli compile --fqbn "$FQBN" \
            --build-property "compiler.cpp.extra_flags=-DUSER_SETUP_LOADED -include $GITHUB_WORKSPACE/config/TFT_eSPI/User_Setup.h" \
            --output-dir build \
            firmware/cheap-rex-display

      - name: Write the release assets
        # boot_app0.bin comes with the core, not out of the build
        run: |
          python3 scripts/release-assets.py "$TAG" build \
            "$HOME/.arduino15/packages/esp32/hardware/esp32/${ESP32_CORE##*@}/tools/partitions/boot_app0.bin" \
            build/release

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" build/release/* --clobber
          else
            prerelease=""
            case "$TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" build/release/* --verify-tag --title "$TAG" --generate-notes $prerelease
          fi
